name: wild-lemon-wp

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: local-wild-lemon
      MARIADB_ROOT_PASSWORD: local-wild-lemon-root
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    depends_on:
      - db
    ports:
      - '127.0.0.1:8088:80'
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-wild-lemon
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: '1'
    volumes:
      - wp_data:/var/www/html
      - ../:/var/www/html/wp-content/themes/wild-lemon

  cli:
    image: wordpress:cli
    profiles: [tools]
    depends_on:
      - wordpress
    user: '33:33'
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-wild-lemon
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: '1'
    volumes:
      - wp_data:/var/www/html
      - ../:/var/www/html/wp-content/themes/wild-lemon

volumes:
  db_data:
  wp_data:
